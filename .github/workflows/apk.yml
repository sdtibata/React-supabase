# Compila el APK de Android en los servidores de GitHub.
# No necesitas Android Studio: ve a la pestaña Actions del repo.
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java (lo pide Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app web (crea la carpeta dist)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Generar ícono y splash desde la carpeta assets
        run: npx capacitor-assets generate --android

      - name: Copiar la app web dentro de Android
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
